[build-system]
requires = ["setuptools>=84"]
build-backend = "setuptools.build_meta"


[project]
name = "dexpi-pid-renderer"
version = "0.1.0"
description = "Render DEXPI P&ID models as SVG and PDF drawings."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }

authors = [
    { name = "Anthony Okoro", email = "antoine.okoro@gmail.com" },
]

dependencies = [
    "pydexpi>=1.2,<2",
    "weasyprint>=69,<70",
]


[project.scripts]
dexpi-render = "dexpi_pid_renderer.cli:main"


[project.optional-dependencies]
examples = [
    "python-dotenv>=1.0.0",
]
dev = [
    "mypy==2.3.1",
    "pre-commit>=4.0,<5.0",
    "pytest>=9,<10",
    "pytest-cov>=7,<8",
    "ruff==0.16.5",
]


[tool.setuptools.packages.find]
where = ["src"]


[tool.mypy]
python_version = "3.12"
strict = true
explicit_package_bases = true

# Report errors for imports whose types cannot be determined.
disallow_any_unimported = true

# Require type annotations for functions and methods.
disallow_untyped_defs = true
disallow_incomplete_defs = true

# Check the bodies of functions even when annotations are incomplete.
check_untyped_defs = true

# Prevent implicit Optional types.
no_implicit_optional = true

# Require explicit return statements.
warn_no_return = true

# Warn about redundant casts and unused ignores.
warn_redundant_casts = true
warn_unused_ignores = true

# Warn about unreachable code.
warn_unreachable = true


[tool.pytest.ini_options]
testpaths = ["tests"]


[tool.ruff]
line-length = 88
target-version = "py312"


[tool.ruff.lint]
select = [
    "E",
    "F",
    "I",
    "UP",
]
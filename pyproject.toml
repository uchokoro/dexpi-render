[build-system]
requires = ["setuptools>=84"]
build-backend = "setuptools.build_meta"


[project]
name = "dexpi-pid-renderer"
version = "0.1.0"
description = "Render DEXPI P&ID models as SVG and PDF drawings."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }

authors = [
    { name = "Anthony Okoro", email = "antoine.okoro@gmail.com" },
]

dependencies = [
    "pydantic>=2.13,<3",
    "pydexpi>=1.2,<2",
    "pymupdf>=1.28,<2",
    "weasyprint>=69,<70",
]


[project.scripts]
dexpi-render = "dexpi_pid_renderer.cli:main"


[project.optional-dependencies]
examples = [
    "python-dotenv>=1.0.0",
]
dev = [
    "mypy==2.3.1",
    "pre-commit>=4.0,<5.0",
    "pytest>=9,<10",
    "pytest-cov>=7,<8",
    "ruff==0.16.5",
]


[tool.setuptools.packages.find]
where = ["src"]


[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = "src"
explicit_package_bases = true

# Enable strict flags globally
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
no_implicit_optional = true
warn_no_return = true
warn_return_any = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_unused_configs = true
warn_unreachable = true


# Enforce strict unimported checks ONLY on the library's codebase
[[tool.mypy.overrides]]
module = [
    "dexpi_pid_renderer.*",
]
disallow_any_unimported = false


# Third-party overrides for un-typed dependencies
[[tool.mypy.overrides]]
module = [
    "pydexpi.*",
    "pymupdf.*",
    "weasyprint.*",
]
ignore_missing_imports = true


[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_decorators = false


[tool.pytest.ini_options]
testpaths = ["tests"]


[tool.ruff]
line-length = 88
target-version = "py312"


[tool.ruff.lint]
select = [
    "E",
    "F",
    "I",
    "UP",
]
